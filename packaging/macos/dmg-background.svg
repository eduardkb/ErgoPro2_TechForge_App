<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <!-- Background of the ErgoPro2 disk image window (2.0.0). Icons are placed by
       scripts/package-macos.sh: ErgoPro2.app at (165, 200), Applications at (495, 200).
       Regenerate the PNGs with "swift scripts/generate-dmg-background.swift" after a change. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#e8eef6"/>
    </linearGradient>
  </defs>
  <rect width="660" height="400" fill="url(#bg)"/>
  <text x="330" y="62" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="600" fill="#1f2a37">Install ErgoPro2</text>
  <text x="330" y="92" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="15" fill="#4a5868">Drag ErgoPro2 to the Applications folder</text>
  <g fill="none" stroke="#2f7de1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 262 200 L 392 200"/>
    <path d="M 372 180 L 394 200 L 372 220"/>
  </g>
  <text x="330" y="352" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="12" fill="#6b7785">Then open ErgoPro2 from Applications.</text>
</svg>
