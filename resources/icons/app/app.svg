<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0F5F73"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- macOS-style rounded square with margin -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="412" rx="184" fill="url(#shine)"/>
  <!-- click ripples -->
  <path d="M652 300 a150 150 0 0 1 112 112" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="30" stroke-linecap="round"/>
  <path d="M652 220 a230 230 0 0 1 192 192" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="30" stroke-linecap="round"/>
  <!-- mouse body -->
  <rect x="352" y="300" width="280" height="430" rx="140" fill="#FFFFFF"/>
  <path d="M492 300 v150" stroke="#0F5F73" stroke-width="18" stroke-linecap="round"/>
  <path d="M352 450 h280" stroke="#0F5F73" stroke-width="18" stroke-opacity="0.35"/>
  <rect x="477" y="350" width="30" height="62" rx="15" fill="#14B8A6"/>
  <!-- left button highlighted (the button ErgoPro2 clicks for you) -->
  <path d="M492 309 a131 131 0 0 0 -131 131 v10 h131 z" fill="#14B8A6" fill-opacity="0.25"/>
</svg>
